[package]
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
name = "licenses"
version.workspace = true
edition.workspace = true
publish = false

# Development tool, not part of the app: `cargo run -p licenses` regenerates
# `crates/desktop/assets/licenses.json` with the licenses of what gets distributed.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
