[package]
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
name = "ssh"
version.workspace = true
edition.workspace = true

[lib]
doctest = false

[dependencies]
# ring instead of aws-lc-rs (the default): builds on Windows without CMake or NASM.
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "3"
thiserror = "2"
tokio = { version = "1", features = ["time", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util"] }
